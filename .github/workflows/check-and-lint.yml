name: Check & Lint

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-and-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.task }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        task: [check, lint]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          runtime: node@lts
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm run ${{ matrix.task }}
