name: ultramarine-server-integration

services:
  postgres:
    image: docker.io/library/postgres:17
    environment:
      POSTGRES_PASSWORD: integration
      POSTGRES_DB: ultramarine
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d ultramarine']
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - postgres:/var/lib/postgresql/data
    networks: [server]

  dashboard:
    build:
      context: ..
      dockerfile: dev/dashboard/Dockerfile
    environment:
      ORIGIN: http://127.0.0.1:3000
      DATABASE_URL: postgres://postgres:integration@postgres:5432/ultramarine
      EMAIL_FROM_ADDRESS: no-reply@integration.test
      EMAIL_FROM_NAME: Ultramarine Server Integration
      EMAIL_REPLY_TO: support@integration.test
      UM_DASHBOARD_STATE_DIR: /var/lib/ultramarine-dashboard
    depends_on:
      postgres:
        condition: service_healthy
    # A new named volume is root-owned. Initialize only the mutable state
    # directory, then run migrations and Dashboard as the unprivileged node user.
    user: '0:0'
    command:
      - /bin/sh
      - -ec
      - |
        mkdir -p /var/lib/ultramarine-dashboard
        chown node:node /var/lib/ultramarine-dashboard
        chmod 700 /var/lib/ultramarine-dashboard
        exec su -s /bin/sh node -c './node_modules/.bin/drizzle-kit migrate --config=drizzle.config.ts && exec node build'
    volumes:
      - dashboard-state:/var/lib/ultramarine-dashboard
    ports:
      - '127.0.0.1:3000:3000'
    networks: [server]

  tetra-smoke:
    build:
      context: ../../tetra
      dockerfile: ../um-dashboard/dev/tetra/Dockerfile
    command:
      - agent-ws-serve
      - --listen
      - 0.0.0.0:7780
      - --tls-cert
      - /var/lib/tetra/config/tls/tetra.crt
      - --tls-key
      - /var/lib/tetra/config/tls/tetra.key
      - --enrollment-token
      - ${TETRA_ENROLLMENT_TOKEN:?Run ./prepare.sh before starting the stack}
    volumes:
      - tetra-smoke-state:/var/lib/tetra
      - ./certs:/var/lib/tetra/config/tls:ro,Z
    networks: [server]

  wss-smoke:
    profiles: ['smoke']
    image: localhost/ultramarine-server-integration_dashboard:latest
    depends_on:
      tetra-smoke:
        condition: service_started
    working_dir: /app/dev
    command: ['node', 'wss-smoke.mjs']
    environment:
      TETRA_ENROLLMENT_TOKEN: ${TETRA_ENROLLMENT_TOKEN:?Run ./prepare.sh before starting the stack}
      TETRA_WSS_URL: wss://tetra-smoke:7780
      TETRA_CA_PATH: /app/dev/certs/public/ca.crt
      TETRA_SMOKE_KEY_PATH: /var/lib/tetra-smoke/controller-ed25519-private.pem
    volumes:
      - tetra-smoke-controller:/var/lib/tetra-smoke
      - ./wss-smoke.mjs:/app/dev/wss-smoke.mjs:ro,Z
      - ./certs/public:/app/dev/certs/public:ro,Z
    networks: [server]

  tetra:
    build:
      context: ../../tetra
      dockerfile: ../um-dashboard/dev/tetra/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - agent-ws-serve
      - --listen
      - 0.0.0.0:7780
      - --tls-cert
      - /var/lib/tetra/config/tls/tetra.crt
      - --tls-key
      - /var/lib/tetra/config/tls/tetra.key
      - --enrollment-token
      - ${TETRA_ENROLLMENT_TOKEN:?Run ./prepare.sh before starting the stack}
    volumes:
      - tetra-state:/var/lib/tetra
      - ./certs:/var/lib/tetra/config/tls:ro,Z
    ports:
      - '127.0.0.1:7780:7780'
    networks: [server]

networks:
  server:
    internal: true

volumes:
  postgres:
  dashboard-state:
  tetra-state:
  tetra-smoke-state:
  tetra-smoke-controller:
