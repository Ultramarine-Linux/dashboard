name: ultramarine-server-integration

services:
  postgres:
    image: docker.io/library/postgres:17
    environment:
      POSTGRES_PASSWORD: integration
      POSTGRES_DB: ultramarine
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d ultramarine']
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - postgres:/var/lib/postgresql/data
    networks: [server]

  dashboard:
    build:
      context: ../../..
      dockerfile: apps/dashboard/dev/dashboard/Dockerfile
    environment:
      ORIGIN: http://127.0.0.1:3000
      DATABASE_URL: postgres://postgres:integration@postgres:5432/ultramarine
      EMAIL_FROM_ADDRESS: no-reply@integration.test
      EMAIL_FROM_NAME: Ultramarine Server Integration
      EMAIL_REPLY_TO: support@integration.test
      UM_DASHBOARD_STATE_DIR: /var/lib/ultramarine-dashboard
    depends_on:
      postgres:
        condition: service_healthy
    user: '0:0'
    command:
      - /bin/sh
      - -ec
      - |
        mkdir -p /var/lib/ultramarine-dashboard
        chown node:node /var/lib/ultramarine-dashboard
        chmod 700 /var/lib/ultramarine-dashboard
        exec su -s /bin/sh node -c './node_modules/.bin/drizzle-kit migrate --config=drizzle.config.ts && exec node build'
    volumes:
      - dashboard-state:/var/lib/ultramarine-dashboard
    ports:
      - '127.0.0.1:3000:3000'
    networks: [server]

  # One-shot host-side enrollment. Run ./enroll-tetra.sh, approve the code in
  # Dashboard, then the helper starts the tetra service below.
  tetra-enroller:
    build:
      context: ../../../../tetra
      dockerfile: ../um-dashboard/apps/dashboard/dev/tetra/Dockerfile
    depends_on:
      dashboard:
        condition: service_started
    command:
      - enroll
      - --dashboard-url
      - http://dashboard:3000
      - --verification-url
      - http://127.0.0.1:3000
      - --agent-url
      - wss://tetra:7780
      - --listen
      - 0.0.0.0:7780
      - --hostname
      - tetra
      - --display-name
      - integration-tetra
      - --identity-dir
      - /var/lib/tetra/identity
      - --config-dir
      - /var/lib/tetra/config
      - --skip-service
      - --insecure
    volumes:
      - tetra-state:/var/lib/tetra
    networks: [server]
    profiles: ['enroll']

  tetra:
    build:
      context: ../../../../tetra
      dockerfile: ../um-dashboard/apps/dashboard/dev/tetra/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - agent-ws-serve
      - --listen
      - 0.0.0.0:7780
      - --identity-dir
      - /var/lib/tetra/identity
      - --tls-cert
      - /var/lib/tetra/config/tetra.crt
      - --tls-key
      - /var/lib/tetra/config/tetra.key
    volumes:
      - tetra-state:/var/lib/tetra
    ports:
      - '127.0.0.1:7780:7780'
    networks: [server]
    profiles: ['tetra']

networks:
  server:
    internal: true

volumes:
  postgres:
  dashboard-state:
  tetra-state:
