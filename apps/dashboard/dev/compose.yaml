name: ultramarine-server-integration

services:
  dashboard:
    build:
      context: ../../..
      dockerfile: apps/dashboard/dev/dashboard/Dockerfile
    environment:
      ORIGIN: http://127.0.0.1:3000
      EMAIL_FROM_ADDRESS: no-reply@integration.test
      EMAIL_FROM_NAME: Ultramarine Server Integration
      EMAIL_REPLY_TO: support@integration.test
      UM_DASHBOARD_STATE_DIR: /var/lib/ultramarine-dashboard
      TETRA_ENROLLMENT_TOKEN_FILE: /run/tetra-dev/TETRA_ENROLLMENT_TOKEN
      TETRA_TLS_CA_CERTIFICATE_FILE: /run/tetra-dev/ca.crt
      TETRA_LOCAL_ENDPOINTS: wss://tetra:7780
    # A new named volume is root-owned. Initialize only the mutable state
    # directory, then run Dashboard as the unprivileged node user. Dashboard
    # snapshots and migrates its SQLite database on startup.
    user: '0:0'
    command:
      - /bin/sh
      - -ec
      - |
        mkdir -p /var/lib/ultramarine-dashboard
        chown node:node /var/lib/ultramarine-dashboard
        chmod 700 /var/lib/ultramarine-dashboard
        exec su -s /bin/sh node -c 'exec node build'
    volumes:
      - dashboard-state:/var/lib/ultramarine-dashboard
      - ./.env:/run/tetra-dev/TETRA_ENROLLMENT_TOKEN:ro,Z
      - ./certs/ca.crt:/run/tetra-dev/ca.crt:ro,Z
    ports:
      - '127.0.0.1:3000:3000'
    networks: [server]

  # Tetra accepts the dashboard's controller key once, using the one-time
  # enrollment token generated by ./prepare.sh. Dashboard enrolls it from the
  # setup page or the "Connect to Tetra" prompt.
  tetra:
    build:
      context: ../../../../tetra
      dockerfile: ../um-dashboard/apps/dashboard/dev/tetra/Dockerfile
    command:
      - agent-ws-serve
      - --listen
      - 0.0.0.0:7780
      - --identity-dir
      - /var/lib/tetra/identity
      - --tls-cert
      - /var/lib/tetra/config/tls/tetra.crt
      - --tls-key
      - /var/lib/tetra/config/tls/tetra.key
      - --enrollment-token
      - ${TETRA_ENROLLMENT_TOKEN:?Run ./prepare.sh before starting the stack}
    volumes:
      - tetra-state:/var/lib/tetra
      - ./certs:/var/lib/tetra/config/tls:ro,Z
    ports:
      - '127.0.0.1:7780:7780'
    networks: [server]

networks:
  server:
    internal: true

volumes:
  dashboard-state:
  tetra-state:
