name: ultramarine-dashboard-dev

services:
  # The dev server against the in-memory Tetra mock. No host setup needed.
  dashboard:
    build:
      context: ../..
      dockerfile: dashboard/dev/dashboard/Dockerfile
    environment:
      TETRA_MOCK: '1'
      UM_DASHBOARD_STATE_DIR: /var/lib/ultramarine-dashboard
    volumes:
      - dashboard-state:/var/lib/ultramarine-dashboard
      - ../src:/src/dashboard/src:ro,z
      - ../static:/src/dashboard/static:ro,z
    ports:
      - '127.0.0.1:3972:3972'

  # The production image (dashboard/Containerfile) against a Tetra on
  # this machine. Start it with --profile tetra; see README.md.
  dashboard-tetra:
    profiles: ['tetra']
    build:
      context: ../..
      dockerfile: dashboard/Containerfile
    # Map your account onto the image's user (65532), so Tetra sees your UID
    # on the socket: start Tetra with --dashboard-user "$USER".
    userns_mode: keep-id:uid=65532,gid=65532
    # Keep your supplementary groups, so membership in the socket's group
    # (`tetra` for tetra.socket) still counts inside the container.
    group_add: ['keep-groups']
    # Tetra's socket carries the host's SELinux label, which a container
    # cannot connect to. The production Quadlet is set up separately.
    security_opt: ['label=disable']
    environment:
      ORIGIN: http://localhost:3972
    volumes:
      - dashboard-tetra-state:/var/lib/ultramarine-dashboard
      - ${TETRA_SOCKET_DIR:-/run/tetra}:/run/tetra:ro
    ports:
      - '127.0.0.1:3972:3972'

volumes:
  dashboard-state:
  dashboard-tetra-state:
