<!doctype html>
<html lang="%lang%">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<!-- Resolve high contrast before first paint. Keep in sync with src/lib/state/contrast.svelte.ts. -->
		<script>
			'use strict';
			(() => {
				try {
					const pref = localStorage.getItem('contrast-preference');
					const on =
						pref === 'on' ||
						(pref !== 'off' && window.matchMedia('(prefers-contrast: more)').matches);
					if (on) document.documentElement.setAttribute('data-contrast', 'more');
				} catch {
					// Storage unavailable; fall back to the default (no high contrast).
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
